version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: shinobi
      POSTGRES_USER: shinobi
      POSTGRES_PASSWORD: shinobi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shinobi"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://shinobi:shinobi@db:5432/shinobi
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      REDIS_URL: redis://redis:6379
      RECORDINGS_PATH: /var/shinobi/recordings
      STREAM_PATH: /var/shinobi/streams
    volumes:
      - recordings:/var/shinobi/recordings
      - streams:/var/shinobi/streams
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  recordings:
  streams:

networks:
  default:
    name: dummy-shinobi-python_default
