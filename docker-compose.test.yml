version: '3.8'

services:
  # Test RTSP server
  rtsp-server:
    image: bluenviron/mediamtx:latest
    networks:
      - dummy-shinobi-python_default
    ports:
      - "8554:8554"  # RTSP port
      - "8888:8888"  # Web UI
    environment:
      - MTX_PROTOCOLS=tcp
    restart: unless-stopped

  # FFmpeg stream generator (test pattern)
  test-stream:
    image: jrottenberg/ffmpeg:latest
    networks:
      - dummy-shinobi-python_default
    command: >
      -re -f lavfi -i testsrc=size=1280x720:rate=30
      -f lavfi -i sine=frequency=1000
      -c:v libx264 -preset ultrafast -tune zerolatency
      -c:a aac -f rtsp rtsp://rtsp-server:8554/test
    depends_on:
      - rtsp-server
    restart: unless-stopped

  # Custom video streamer - mount your video file here
  # Put your video file in ./videos/4.mp4
  custom-stream:
    image: jrottenberg/ffmpeg:latest
    networks:
      - dummy-shinobi-python_default
    volumes:
      - ./videos:/videos
    command: >
      -re -stream_loop -1 -i /videos/4.mp4
      -c:v libx264 -preset ultrafast -tune zerolatency
      -c:a aac -f rtsp rtsp://rtsp-server:8554/myvideo
    depends_on:
      - rtsp-server
    restart: unless-stopped

networks:
  dummy-shinobi-python_default:
    external: true
